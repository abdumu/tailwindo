<div class="box" data-twtest="bulma-form-box">
  <div class="field" data-twtest="bulma-field-name">
    <label class="label" data-twtest="bulma-label-name">Name</label>
    <div class="control" data-twtest="bulma-control-name">
      <input class="input" type="text" placeholder="e.g Alex Smith" data-twtest="bulma-input-name">
    </div>
  </div>

  <div class="field" data-twtest="bulma-field-email">
    <label class="label" data-twtest="bulma-label-email">Email</label>
    <div class="control" data-twtest="bulma-control-email">
      <input class="input" type="email" placeholder="e.g. alexsmith@gmail.com" data-twtest="bulma-input-email">
    </div>
    <p class="help" data-twtest="bulma-help-email">We will not share your email.</p>
  </div>
</div>
