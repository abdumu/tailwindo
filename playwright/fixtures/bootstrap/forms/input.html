<form data-twtest="form-container">
  <div class="mb-3" data-twtest="form-group-1">
    <label for="exampleInputEmail1" class="form-label" data-twtest="form-label-email">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" data-twtest="form-input-email">
    <div id="emailHelp" class="form-text" data-twtest="form-text-help">We'll never share your email with anyone else.</div>
  </div>
  <div class="mb-3" data-twtest="form-group-2">
    <label for="exampleInputPassword1" class="form-label" data-twtest="form-label-pwd">Password</label>
    <input type="password" class="form-control" id="exampleInputPassword1" data-twtest="form-input-pwd">
  </div>
  <div class="mb-3 form-check" data-twtest="form-group-3">
    <input type="checkbox" class="form-check-input" id="exampleCheck1" data-twtest="form-checkbox">
    <label class="form-check-label" for="exampleCheck1" data-twtest="form-checkbox-label">Check me out</label>
  </div>
  <button type="submit" class="btn btn-primary" data-twtest="form-submit">Submit</button>
</form>
